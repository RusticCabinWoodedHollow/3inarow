<style>
  :root {
    --bg1:#ffecd2; --bg2:#fcb69f;
    --text:#4a2c1a;
    --panel:rgba(255,255,255,.6);
    --bar-track:rgba(255,255,255,.5);
    --board-bg:rgba(255,255,255,.4);
    --board-shadow: inset 0 2px 12px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.10);
    --title-shadow: 0 1px 0 rgba(255,255,255,.5);
    --accent:#e65100;
    --card-bg:#fff;
  }
  html[data-theme="dark"] {
    --bg1:#3a2a22; --bg2:#171017;
    --text:#f5e9db;
    --panel:rgba(58,45,60,.75);
    --bar-track:rgba(255,255,255,.15);
    --board-bg:rgba(24,18,26,.55);
    --board-shadow: inset 0 2px 12px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.45);
    --title-shadow: 0 1px 0 rgba(0,0,0,.6);
    --accent:#ffb347;
    --card-bg:#2c2133;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 100%);
    color:var(--text);
    transition: background .3s, color .3s;
    display:flex; justify-content:center;
    overflow:hidden; overscroll-behavior:none;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #app {
    width:100%; max-width:520px;
    height:100%; height:100dvh;
    display:flex; flex-direction:column;
    padding: max(10px, env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    min-height:0;
  }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  h1 { font-size:21px; font-weight:900; letter-spacing:.3px; text-shadow:var(--title-shadow); }
  .hdr-btns { display:flex; gap:8px; }
  .icon-btn {
    width:42px; height:42px; border:none; border-radius:14px;
    background:var(--panel); font-size:20px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s;
  }
  .icon-btn:active { transform:scale(.9); }
  .stats { display:flex; gap:8px; margin-bottom:10px; }
  .stat {
    flex:1; background:var(--panel); border-radius:14px;
    padding:7px 4px 6px; text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .stat .lbl { font-size:11px; font-weight:700; opacity:.65; text-transform:uppercase; letter-spacing:.5px; }
  .stat .val { font-size:21px; font-weight:900; line-height:1.15; }
  .stat.low .val { color:#e53935; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.18); } }
  .progress-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  #barWrap { flex:1; height:16px; background:var(--bar-track); border-radius:10px; overflow:hidden; box-shadow:inset 0 1px 4px rgba(0,0,0,.12); }
  #bar { height:100%; width:0%; border-radius:10px; background:linear-gradient(90deg,#ffd54f,#ff7043); transition:width .45s ease; }
  #targetVal { font-size:12px; font-weight:800; white-space:nowrap; opacity:.8; }
  #board-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #board {
    position:relative; border-radius:18px; overflow:hidden;
    background:var(--board-bg);
    box-shadow: var(--board-shadow);
    touch-action:none;
  }
  .tile { position:absolute; top:0; left:0; width:var(--cell,40px); height:var(--cell,40px); will-change:transform; transition:transform .3s cubic-bezier(.3,1.25,.45,1); }
  .tile span {
    display:flex; align-items:center; justify-content:center;
    width:98%; height:98%; margin:1%;
    border-radius:24%;
    font-size:1em;
    box-shadow:0 3px 7px rgba(0,0,0,.16), inset 0 -4px 8px rgba(0,0,0,.05);
  }
  .tile.sel span {
    box-shadow:0 0 0 3px #fff, 0 0 16px 5px rgba(255,255,255,.95), 0 3px 7px rgba(0,0,0,.16);
    animation:selPulse .55s ease-in-out infinite alternate;
  }
  @keyframes selPulse { from { transform:scale(1); } to { transform:scale(1.13); } }
  .float {
    position:absolute; z-index:5; pointer-events:none;
    font-weight:900; color:#fff;
    text-shadow:0 2px 5px rgba(0,0,0,.4);
    transform:translate(-50%,-50%);
  }
  footer { margin-top:8px; text-align:center; font-size:12px; font-weight:600; opacity:.65; }
  #overlay {
    position:fixed; inset:0; z-index:10;
    background:rgba(46,20,5,.55); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  #overlay.show { opacity:1; pointer-events:auto; }
  #ovCard {
    background:var(--card-bg); color:var(--text); border-radius:26px; padding:30px 26px 26px;
    width:min(320px, 84vw); text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.35);
    transform:scale(.8); transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  #overlay.show #ovCard { transform:scale(1); }
  #ovIcon { font-size:52px; margin-bottom:6px; }
  #ovTitle { font-size:23px; font-weight:900; margin-bottom:8px; }
  #ovText { font-size:15px; line-height:1.55; opacity:.85; margin-bottom:20px; }
  #ovText b { color:var(--accent); }
  #ovBtn {
    border:none; cursor:pointer;
    background:linear-gradient(180deg,#ffb347,#ff7043);
    color:#fff; font-size:17px; font-weight:800;
    padding:13px 30px; border-radius:16px;
    box-shadow:0 6px 16px rgba(255,112,67,.4);
    transition:transform .15s;
  }
  #ovBtn:active { transform:scale(.93); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍓 3 в ряд дзен</h1>
    <div class="hdr-btns">
      <button id="themeBtn" class="icon-btn" aria-label="Сменить тему">🌙</button>
      <button id="shuffleBtn" class="icon-btn" aria-label="Перемешать">🔀</button>
      <button id="newBtn" class="icon-btn" aria-label="Новая игра">🔄</button>
    </div>
  </header>
  <div class="stats">
    <div class="stat"><div class="lbl">Уровень</div><div class="val" id="levelVal">1</div></div>
    <div class="stat"><div class="lbl">Счёт</div><div class="val" id="scoreVal">0</div></div>
    <div class="stat" id="movesStat"><div class="lbl">Ходы</div><div class="val" id="movesVal">20</div></div>
  </div>
  <div class="progress-row">
    <div id="barWrap"><div id="bar"></div></div>
    <span id="targetVal">Цель: 800</span>
  </div>
  <div id="board-wrap"><div id="board"></div></div>
  <footer>Меняй фрукты и собирай 3 в ряд 🍒</footer>
</div>
<div id="overlay">
  <div id="ovCard">
    <div id="ovIcon">🎉</div>
    <div id="ovTitle"></div>
    <div id="ovText"></div>
    <button id="ovBtn"></button>
  </div>
</div>
<script>
(() => {
'use strict';

const ROWS = 5, COLS = 5;
const SWAP_MS = 190, FALL_MS = 300, POP_MS = 260;
const START_MOVES = 20;

const FRUITS = [
  { e:'🍎', bg:'#ffd0d0' },
  { e:'🍌', bg:'#fff0b3' },
  { e:'🍇', bg:'#e3d2ff' },
  { e:'🍊', bg:'#ffd9a8' },
  { e:'🍓', bg:'#ffc3d4' },
  { e:'🍉', bg:'#c8f2c8' },
  { e:'🥝', bg:'#e8f0c0' }
];

const $ = id => document.getElementById(id);
const boardEl = $('board'), wrapEl = $('board-wrap');
const scoreEl = $('scoreVal'), movesEl = $('movesVal'), levelEl = $('levelVal');
const targetEl = $('targetVal'), barEl = $('bar'), movesStat = $('movesStat');
const overlay = $('overlay'), ovIcon = $('ovIcon'), ovTitle = $('ovTitle'), ovText = $('ovText'), ovBtn = $('ovBtn');

let cell = 40;
let board = [];
let score = 0, level = 1, movesLeft = START_MOVES;
let busy = false, over = false, paused = false;
let selected = null, drag = null;
let gameId = 0;

const rand = n => (Math.random() * n) | 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const targetFor = lv => 800 + (lv - 1) * 600;

/* ---------- плитки ---------- */
function paintTile(t) {
  const f = FRUITS[t.fruit];
  t.sp.textContent = f.e;
  t.sp.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, ' + f.bg + ' 70%)';
}
function makeTile(fruit, r, c) {
  const el = document.createElement('div');
  el.className = 'tile';
  const sp = document.createElement('span');
  el.appendChild(sp);
  boardEl.appendChild(el);
  const t = { el, sp, fruit, r, c };
  paintTile(t);
  t.el.style.transform = 'translate(' + c * cell + 'px,' + r * cell + 'px)';
  return t;
}
function place(t) { t.el.style.transform = 'translate(' + t.c * cell + 'px,' + t.r * cell + 'px)'; }
function setFruit(t, f) { t.fruit = f; paintTile(t); }

function layout() {
  const w = wrapEl.clientWidth, h = wrapEl.clientHeight;
  cell = Math.max(26, Math.floor(Math.min(w, h) / COLS));
  boardEl.style.setProperty('--cell', cell + 'px');
  boardEl.style.width = cell * COLS + 'px';
  boardEl.style.height = cell * ROWS + 'px';
  boardEl.style.fontSize = Math.round(cell * 0.62) + 'px';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r] && board[r][c]) place(board[r][c]);
}

/* ---------- поиск совпадений и ходов ---------- */
function findMatches() {
  const m = new Set();
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c <= COLS; c++) {
      const same = c < COLS && board[r][c] && board[r][c - 1] && board[r][c].fruit === board[r][c - 1].fruit;
      if (same) run++;
      else { if (run >= 3) for (let k = c - run; k < c; k++) m.add(r * COLS + k); run = 1; }
    }
  }
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r <= ROWS; r++) {
      const same = r < ROWS && board[r][c] && board[r - 1][c] && board[r][c].fruit === board[r - 1][c].fruit;
      if (same) run++;
      else { if (run >= 3) for (let k = r - run; k < r; k++) m.add(k * COLS + c); run = 1; }
    }
  }
  return m;
}
function matchesIn1D(a) {
  const g = (r, c) => a[r * COLS + c];
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c <= COLS; c++) {
      const same = c < COLS && g(r, c) !== null && g(r, c) === g(r, c - 1);
      if (same) run++;
      else { if (run >= 3) return true; run = 1; }
    }
  }
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r <= ROWS; r++) {
      const same = r < ROWS && g(r, c) !== null && g(r, c) === g(r - 1, c);
      if (same) run++;
      else { if (run >= 3) return true; run = 1; }
    }
  }
  return false;
}
function moveExistsIn1D(a) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (c + 1 < COLS) {
      const i = r * COLS + c, j = i + 1, t = a[i], u = a[j];
      a[i] = u; a[j] = t;
      const ok = matchesIn1D(a);
      a[i] = t; a[j] = u;
      if (ok) return true;
    }
    if (r + 1 < ROWS) {
      const i = r * COLS + c, j = i + COLS, t = a[i], u = a[j];
      a[i] = u; a[j] = t;
      const ok = matchesIn1D(a);
      a[i] = t; a[j] = u;
      if (ok) return true;
    }
  }
  return false;
}
function hasMove() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const a = board[r][c];
    if (c + 1 < COLS) {
      const b = board[r][c + 1];
      board[r][c] = b; board[r][c + 1] = a;
      const ok = findMatches().size > 0;
      board[r][c] = a; board[r][c + 1] = b;
      if (ok) return true;
    }
    if (r + 1 < ROWS) {
      const b = board[r + 1][c];
      board[r][c] = b; board[r + 1][c] = a;
      const ok = findMatches().size > 0;
      board[r][c] = a; board[r + 1][c] = b;
      if (ok) return true;
    }
  }
  return false;
}
function genBoard() {
  const a = new Array(ROWS * COLS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    let f;
    do { f = rand(FRUITS.length); }
    while (
      (c >= 2 && a[r * COLS + c - 1] === f && a[r * COLS + c - 2] === f) ||
      (r >= 2 && a[(r - 1) * COLS + c] === f && a[(r - 2) * COLS + c] === f)
    );
    a[r * COLS + c] = f;
  }
  return a;
}

/* ---------- HUD ---------- */
function hud() {
  scoreEl.textContent = score;
  movesEl.textContent = movesLeft;
  levelEl.textContent = level;
  targetEl.textContent = 'Цель: ' + targetFor(level);
  barEl.style.width = Math.min(100, Math.round(score / targetFor(level) * 100)) + '%';
  movesStat.classList.toggle('low', movesLeft <= 5 && !over);
}

/* ---------- игровые механики ---------- */
function swapTiles(a, b) {
  board[a.r][a.c] = b; board[b.r][b.c] = a;
  const r = a.r, c = a.c;
  a.r = b.r; a.c = b.c; b.r = r; b.c = c;
  place(a); place(b);
}
function wiggle(t) {
  t.sp.animate(
    [{ transform:'translateX(0)' }, { transform:'translateX(-12%)' }, { transform:'translateX(10%)' }, { transform:'translateX(0)' }],
    { duration: 280 }
  );
}
function floatScore(pts, m) {
  let sx = 0, sy = 0;
  m.forEach(key => { sx += (key % COLS) + .5; sy += ((key / COLS) | 0) + .5; });
  sx /= m.size; sy /= m.size;
  const d = document.createElement('div');
  d.className = 'float';
  d.textContent = '+' + pts;
  d.style.left = sx * cell + 'px';
  d.style.top = sy * cell + 'px';
  d.style.fontSize = Math.round(cell * .5) + 'px';
  boardEl.appendChild(d);
  d.animate(
    [
      { transform:'translate(-50%,-50%) scale(.5)', opacity:0 },
      { transform:'translate(-50%,-100%) scale(1.2)', opacity:1, offset:.25 },
      { transform:'translate(-50%,-220%) scale(1)', opacity:0 }
    ],
    { duration: 850, easing: 'ease-out' }
  ).onfinish = () => d.remove();
}

function gravity() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c]) {
        if (write !== r) {
          board[write][c] = board[r][c];
          board[r][c] = null;
          board[write][c].r = write;
          place(board[write][c]);
        }
        write--;
      }
    }
  }
}
function refill() {
  for (let c = 0; c < COLS; c++) {
    const empt = [];
    for (let r = 0; r < ROWS; r++) if (!board[r][c]) empt.push(r);
    const k = empt.length;
    for (const r of empt) {
      const t = makeTile(rand(FRUITS.length), r, c);
      board[r][c] = t;
      t.el.style.transition = 'none';
      t.el.style.transform = 'translate(' + c * cell + 'px,' + (r - k) * cell + 'px)';
      void t.el.offsetWidth;
      t.el.style.transition = '';
      place(t);
    }
  }
}

async function resolveBoard(my) {
  let chain = 1;
  let m = findMatches();
  while (m.size > 0) {
    const pts = m.size * 10 * chain + (chain - 1) * 25 * m.size;
    score += pts;
    hud();
    floatScore(pts, m);
    if (navigator.vibrate) navigator.vibrate(12);
    m.forEach(key => {
      const r = (key / COLS) | 0, c = key % COLS;
      const t = board[r][c];
      board[r][c] = null;
      t.sp.animate(
        [{ transform:'scale(1)', opacity:1 }, { transform:'scale(1.6) rotate(25deg)', opacity:0 }],
        { duration: POP_MS, easing: 'ease-in', fill: 'forwards' }
      );
      setTimeout(() => t.el.remove(), POP_MS + 80);
    });
    await sleep(POP_MS + 30);
    if (gameId !== my) return;
    gravity();
    refill();
    await sleep(FALL_MS + 50);
    if (gameId !== my) return;
    chain++;
    m = findMatches();
  }
  if (!hasMove()) await doShuffle(my);
}

async function doShuffle(my) {
  const a = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) a.push(board[r][c].fruit);
  let tries = 0;
  do {
    for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
    tries++;
  } while (tries < 300 && (matchesIn1D(a) || !moveExistsIn1D(a)));
  let i = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) setFruit(board[r][c], a[i++]);
  boardEl.querySelectorAll('.tile span').forEach(sp => {
    sp.animate(
      [{ transform:'scale(0) rotate(-180deg)' }, { transform:'scale(1) rotate(0deg)' }],
      { duration: 400, delay: rand(140), easing: 'cubic-bezier(.34,1.56,.64,1)' }
    );
  });
  await sleep(650);
  if (gameId !== my) return;
}

async function playerShuffle() {
  if (busy || over || paused) return;
  const my = gameId;
  busy = true;
  clearSel();
  await doShuffle(my);
  if (gameId !== my) return;
  busy = false;
}

async function trySwap(a, b) {
  if (busy || over || paused) return;
  const ta = board[a.r][a.c], tb = board[b.r][b.c];
  if (!ta || !tb) return;
  const my = gameId;
  busy = true;
  clearSel();
  swapTiles(ta, tb);
  await sleep(SWAP_MS + 40);
  if (gameId !== my) return;
  if (findMatches().size === 0) {
    swapTiles(ta, tb);
    wiggle(ta); wiggle(tb);
    await sleep(SWAP_MS + 40);
    if (gameId !== my) return;
    busy = false;
    return;
  }
  movesLeft--;
  hud();
  await resolveBoard(my);
  if (gameId !== my) return;
  busy = false;
  endCheck();
}

function endCheck() {
  if (score >= targetFor(level)) {
    paused = true;
    if (navigator.vibrate) navigator.vibrate(30);
    showOverlay('levelup');
  } else if (movesLeft <= 0) {
    over = true;
    hud();
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    showOverlay('gameover');
  }
}

/* ---------- оверлеи ---------- */
function showOverlay(kind) {
  if (kind === 'levelup') {
    ovIcon.textContent = '🎉';
    ovTitle.textContent = 'Уровень ' + level + ' пройден!';
    ovText.innerHTML = 'Счёт: <b>' + score + '</b><br>Новая цель: <b>' + targetFor(level + 1) + '</b> очков<br>Ходы пополнены!';
    ovBtn.textContent = 'Дальше ▶';
    ovBtn.onclick = () => {
      level++;
      movesLeft = START_MOVES;
      hud();
      if (score >= targetFor(level)) showOverlay('levelup');
      else { overlay.classList.remove('show'); paused = false; }
    };
  } else {
    ovIcon.textContent = '💔';
    ovTitle.textContent = 'Игра окончена';
    ovText.innerHTML = 'Ходы закончились!<br>Счёт: <b>' + score + '</b> · Уровень: <b>' + level + '</b>';
    ovBtn.textContent = 'Играть снова 🔄';
    ovBtn.onclick = () => {
      overlay.classList.remove('show');
      newGame();
    };
  }
  overlay.classList.add('show');
}

/* ---------- новый игровой процесс ---------- */
function newGame() {
  gameId++;
  busy = false; over = false; paused = false;
  selected = null; drag = null;
  score = 0; level = 1; movesLeft = START_MOVES;
  boardEl.querySelectorAll('.tile, .float').forEach(e => e.remove());
  board = [];
  let fr;
  do { fr = genBoard(); } while (!moveExistsIn1D(fr));
  layout();
  for (let r = 0; r < ROWS; r++) {
    board.push([]);
    for (let c = 0; c < COLS; c++) {
      const t = makeTile(fr[r * COLS + c], r, c);
      board[r].push(t);
      t.sp.animate(
        [{ transform:'scale(0)', opacity:0 }, { transform:'scale(1)', opacity:1 }],
        { duration: 260, delay: (r + c) * 22, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }
      );
    }
  }
  hud();
}

/* ---------- управление (тач + мышь) ---------- */
function cellFromPoint(e) {
  const rect = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / cell);
  const r = Math.floor((e.clientY - rect.top) / cell);
  return (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? { r, c } : null;
}
function select(p) {
  clearSel();
  selected = p;
  const t = board[p.r][p.c];
  if (t) t.el.classList.add('sel');
}
function clearSel() {
  if (selected) {
    const t = board[selected.r] && board[selected.r][selected.c];
    if (t) t.el.classList.remove('sel');
    selected = null;
  }
}

boardEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (busy || over || paused) return;
  const p = cellFromPoint(e);
  if (!p || !board[p.r] || !board[p.r][p.c]) return;
  drag = { x: e.clientX, y: e.clientY, r: p.r, c: p.c };
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || busy || over || paused) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const th = Math.max(12, cell * .3);
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  const from = { r: drag.r, c: drag.c };
  const to = Math.abs(dx) > Math.abs(dy)
    ? { r: from.r, c: from.c + (dx > 0 ? 1 : -1) }
    : { r: from.r + (dy > 0 ? 1 : -1), c: from.c };
  drag = null;
  if (to.r >= 0 && to.r < ROWS && to.c >= 0 && to.c < COLS) trySwap(from, to);
});
boardEl.addEventListener('pointerup', e => {
  if (!drag) return;
  const p = { r: drag.r, c: drag.c };
  drag = null;
  if (busy || over || paused) return;
  if (selected) {
    if (selected.r === p.r && selected.c === p.c) { clearSel(); return; }
    if (Math.abs(selected.r - p.r) + Math.abs(selected.c - p.c) === 1) {
      const s = selected;
      clearSel();
      trySwap(s, p);
      return;
    }
  }
  select(p);
});
boardEl.addEventListener('pointercancel', () => { drag = null; });
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 100));

$('newBtn').addEventListener('click', () => {
  overlay.classList.remove('show');
  newGame();
});
$('shuffleBtn').addEventListener('click', playerShuffle);

/* ---------- тема (светлая / тёмная) ---------- */
const themeBtn = $('themeBtn');
const themeMeta = document.querySelector('meta[name="theme-color"]');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  if (themeMeta) themeMeta.content = t === 'dark' ? '#171017' : '#fcb69f';
}
(function initTheme() {
  let t;
  try { t = localStorage.getItem('fruit-puzzle-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark')
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(t);
})();
themeBtn.addEventListener('click', () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('fruit-puzzle-theme', t); } catch (e) {}
  applyTheme(t);
});

/* ---------- старт ---------- */
newGame();
})();
</script>
</body>
</html>
